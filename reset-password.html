<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Your Password — HappyHabit</title>
<!--
  Pinned to an exact version deliberately. This was previously
  "@supabase/supabase-js@2" (floating), which silently tracks whatever the
  newest 2.x release is on every page load. That's how this page ended up
  broken without anyone touching this file: the CDN was serving 2.114.0,
  whose internal _getSessionFromURL() hard-requires access_token AND
  expires_in AND refresh_token AND token_type to ALL be present in the hash,
  or it throws "No session defined in URL" (silently — the error is
  swallowed during client init and never reaches this page's own code).
  A real, valid, unexpired recovery link's hash was missing expires_in
  and/or token_type, so that check failed and getSession() below just came
  back with session: null, which is indistinguishable from an actually
  expired link. See the load handler for the fix (we no longer depend on
  that auto-parser at all).
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.114.0"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #FFFCF5;
    color: #3d2800;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 4px 20px rgba(61,40,0,0.08);
    padding: 36px 28px;
    max-width: 400px;
    width: 100%;
    text-align: center;
  }
  .star { font-size: 48px; margin-bottom: 8px; }
  h1 { font-size: 22px; margin-bottom: 8px; }
  p.subtitle { font-size: 14px; color: #6b6358; margin-bottom: 24px; line-height: 1.5; }
  label {
    display: block;
    text-align: left;
    font-size: 12px;
    font-weight: 700;
    color: #888;
    margin-bottom: 6px;
    margin-top: 16px;
  }
  .input-wrapper {
    position: relative;
  }
  input {
    width: 100%;
    padding: 14px;
    padding-right: 44px;
    border: 1.5px solid #CECBF6;
    border-radius: 12px;
    font-size: 14px;
    background: #f8f6ff;
    color: #3d2800;
  }
  .toggle-eye {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 18px;
    user-select: none;
    background: none;
    border: none;
    padding: 4px;
  }
  button.submit-btn {
    width: 100%;
    background: #FAC775;
    border: none;
    border-radius: 20px;
    padding: 16px;
    font-size: 15px;
    font-weight: 700;
    color: #3d2800;
    margin-top: 24px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .message {
    border-radius: 10px;
    padding: 12px;
    margin-top: 16px;
    font-size: 13px;
    font-weight: 600;
    display: none;
  }
  .message.error { background: #FFE0DC; color: #993C1D; display: block; }
  .message.success { background: #97C45920; color: #3B6D11; display: block; }
</style>
</head>
<body>

  <div class="card">
    <div class="star">⭐</div>
    <h1 id="title">Reset Your Password</h1>
    <p class="subtitle" id="subtitle">Enter a new password for your HappyHabit account.</p>

    <div id="form-section">
      <label>New Password</label>
      <div class="input-wrapper">
        <input type="password" id="newPassword" placeholder="At least 6 characters" />
        <button type="button" class="toggle-eye" onclick="togglePassword('newPassword', this)">👁️</button>
      </div>

      <label>Confirm New Password</label>
      <div class="input-wrapper">
        <input type="password" id="confirmPassword" placeholder="Re-enter new password" />
        <button type="button" class="toggle-eye" onclick="togglePassword('confirmPassword', this)">👁️</button>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="handleReset()">Update Password</button>
    </div>

    <div class="message" id="message"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://sitcujratynhebvrjbnw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpdGN1anJhdHluaGVidnJqYm53Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NTM3NDUsImV4cCI6MjA5NTIyOTc0NX0.4evHyNTO4QoE2YJvQqyoBWEZ0PTjJO7uoPT9kzLvlEo';

    // detectSessionInUrl: false — we parse the hash and set the session ourselves
    // (see below) instead of letting supabase-js's auto-parser do it, because that
    // auto-parser is stricter about which hash params must be present than we can
    // rely on. See the header comment for why.
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { detectSessionInUrl: false }
    });

    const messageEl = document.getElementById('message');
    const formSection = document.getElementById('form-section');
    const titleEl = document.getElementById('title');
    const subtitleEl = document.getElementById('subtitle');

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = 'message ' + type;
    }

    function togglePassword(fieldId, btnEl) {
      const field = document.getElementById(fieldId);
      if (field.type === 'password') {
        field.type = 'text';
        btnEl.textContent = '🙈';
      } else {
        field.type = 'password';
        btnEl.textContent = '👁️';
      }
    }

    function showInvalidLink() {
      formSection.style.display = 'none';
      titleEl.textContent = 'Invalid or Expired Link';
      subtitleEl.textContent = 'This password reset link is invalid or has expired. Please request a new one from the app.';
    }

    // Supabase's recovery email redirects here with the token in the URL hash
    // fragment: #access_token=...&refresh_token=...&type=recovery&... (plus
    // whichever other fields that particular GoTrue release happens to send —
    // this is NOT guaranteed to be a fixed set, which is exactly what broke this
    // page before: supabase-js's built-in auto-parser demanded four specific
    // fields all be present (access_token, expires_in, refresh_token,
    // token_type) and threw internally the moment one was missing, with the
    // failure never surfacing anywhere in this page's own code or console.
    //
    // Fix: parse the hash ourselves and only require the two fields that
    // actually matter (access_token, refresh_token), then hand them to
    // setSession() — which derives the real expiry from the access_token's own
    // JWT `exp` claim rather than trusting a separate expires_in/expires_at
    // param, so it isn't sensitive to which optional fields the redirect
    // includes.
    window.addEventListener('load', async () => {
      const hashParams = new URLSearchParams(window.location.hash.slice(1));
      const accessToken = hashParams.get('access_token');
      const refreshToken = hashParams.get('refresh_token');
      const type = hashParams.get('type');

      // TEMP DIAGNOSTIC LOGGING — safe to remove once the fix is confirmed live.
      // Logs only param *names* and the boolean outcome, never token values.
      console.log('[reset-password] hash params present:', [...hashParams.keys()]);
      console.log('[reset-password] type param:', type);

      if (!accessToken || !refreshToken) {
        console.warn('[reset-password] missing access_token or refresh_token in URL hash — cannot proceed.', {
          hasAccessToken: !!accessToken,
          hasRefreshToken: !!refreshToken,
        });
        showInvalidLink();
        return;
      }

      const { data, error } = await supabaseClient.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken,
      });

      // TEMP DIAGNOSTIC LOGGING — safe to remove once the fix is confirmed live.
      console.log('[reset-password] setSession() result:', { hasSession: !!data?.session, error });

      if (error || !data.session) {
        showInvalidLink();
        return;
      }

      // Drop the token out of the URL bar/history now that the session is set.
      history.replaceState(null, '', window.location.pathname);
    });

    async function handleReset() {
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const submitBtn = document.getElementById('submitBtn');

      if (newPassword.length < 6) {
        showMessage('Password must be at least 6 characters.', 'error');
        return;
      }
      if (newPassword !== confirmPassword) {
        showMessage('Passwords do not match.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating...';

      const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

      if (error) {
        showMessage('Failed to update password: ' + error.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password';
        return;
      }

      formSection.style.display = 'none';
      titleEl.textContent = 'Password Updated! 🎉';
      subtitleEl.textContent = 'You can now go back to the HappyHabit app and log in with your new password.';
      showMessage('Your password has been changed successfully.', 'success');
    }
  </script>

</body>
</html>
